    en: |-
      Hi, I'm Nassim, an MSc student in Digital Transformation at Roskilde University with a professional bachelor's in Business Economics & IT behind me. Alongside my studies, I've worked in IT support and web design. In my free time, I train in martial arts and volunteer as a coach.

