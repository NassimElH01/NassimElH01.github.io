      Hej, jeg hedder Nassim. Jeg har en professionsbachelor i Økonomi & IT med i bagagen og læser nu cand.it. i Digital Transformation på RUC. Sideløbende med studierne har jeg arbejdet med IT-support og webdesign. I fritiden dyrker jeg kampsport og er frivillig træner.

      Som junior projektleder og PMO-praktikant støttede jeg projektledelsen på IT- og cybersikkerhedsprojekter og stod selv for dele af nogle af dem. Jeg planlagde arbejdet i Azure DevOps, byggede Power BI-dashboards, som ledelsen brugte, og lærte kolleger at bruge nye værktøjer. Jeg er PRINCE2-certificeret og har taget kurser i agil projektledelse, dataanalyse og cybersikkerhed.

      I et studiejob kan jeg bidrage med struktur, opfølgning og data, der er til at handle på.
