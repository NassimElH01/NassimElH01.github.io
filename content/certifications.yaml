  # Source: LinkedIn ("McKinsey Forward Program", McKinsey & Company)
  name: McKinsey Forward
  issuer: McKinsey & Company
  # Source: LinkedIn ("Udstedt maj 2024"); OWNER-PDF p.17 (Certificeringer & Kursusforløb:
