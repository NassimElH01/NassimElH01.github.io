# Skill group "Kode & data" from the owner's brief (CLAUDE.md).
# usedIn cites Nassim's own text: the old site (NassimElH01), the owner's CVs, the
# Gen AI & ML elective exam (EXAM) and the Royal Unibrew internship report (REPORT).
# The posture checker and the arcade (p5.js) were committed under the "Can Kurt" identity,
# but the owner confirmed authorship on 2026-10-04 and called them personal on 2026-10-05.
# OWNER-PDF is the owner's 18-page text pack ("Her er en komplet ... tekstpakke", shared
# 2026-10-11; written with an AI assistant, so used for facts only; PDF page numbers).
# It is cited only where it ties a skill to a project, course or job; a skill it merely
# lists is not usage. Earlier sources win where they conflict.
# Tjekkit is a group project (owner 2026-10-11). His own part was the wireframes and the
# prototype, and the system was not finished (second round, same day), so entries below that
# describe the group's work say "group project (not finished)".
group:
  en: "Code & data"
  da: "Kode & data"
order: 1
items:
  - id: python
    name:
      en: "Python"
      da: "Python"
    usedIn:
      # Source: EXAM (p.21: ML notebook assignments, "mit arbejde med Google Colab og Python-udvidelser")
      - context: study
        project: genai-ml-elective
        note:
          en: "Machine learning notebooks in Google Colab"
          da: "Machine learning-notebooks i Google Colab"
      # Source: OWNER-PDF p.7 (3. Udvalgte Projekter, Tjekkit: "Udviklet i Python med modulariseret
      # OOP-struktur opdelt i logiske ansvarsområder: App, Menu, LogIn og Ansat"); owner 2026-10-11
      # (group project, 2nd semester) and owner 2026-10-11, second round (not finished; his part was the wireframes and
      # the prototype), so the note does not claim a finished build.
      - context: study
        project: tjekkit
        note:
          en: "Group project (not finished): object-oriented structure split into App, Menu, LogIn and Ansat"
          da: "Gruppeprojekt (ikke færdigt): objektorienteret struktur opdelt i App, Menu, LogIn og Ansat"
      # Source: OWNER-PDF p.9-10 (3. Udvalgte Projekter, Airbnb, "Metode & Eksekvering i Python":
      # loading with Pandas and NumPy, cleaning, lambda functions, Seaborn and Matplotlib)
      - context: study
        project: airbnb-eda
        note:
          en: "Data cleaning and analysis with pandas and NumPy, charts with Matplotlib and Seaborn"
          da: "Datarensning og analyse med pandas og NumPy, diagrammer med Matplotlib og Seaborn"

  - id: sql-relational-databases
    name:
      en: "SQL and relational databases (normalization, data modeling)"
      da: "SQL og relationelle databaser (normalisering, datamodellering)"
    # OWNER-PDF p.2 (Kernekompetencer, Relationelle Databaser & SQL) also names E/R modelling,
    # normalisation (1NF-3NF) and DDL/DML in MySQL, and p.16 lists SQL under the IBM Data Analyst
    # certificate, but neither ties them to a project, so only Tjekkit is cited.
    usedIn:
      # Source: OWNER-PDF p.7 (3. Udvalgte Projekter, Tjekkit: "Tilknyttet en relationel
      # MySQL-database: Tabeller til medarbejderstamdata (ansat) og tidsregistrering (Vagt)
      # struktureret med primær- og fremmednøgler samt dataintegritet"); owner 2026-10-11 (group
      # project) and owner 2026-10-11, second round (not finished), so the note does not claim a finished build.
      - context: study
        project: tjekkit
        note:
          en: "Group project (not finished): MySQL database design with tables for employee data and time registration, linked by primary and foreign keys"
          da: "Gruppeprojekt (ikke færdigt): MySQL-databasedesign med tabeller til medarbejderdata og tidsregistrering, forbundet med primær- og fremmednøgler"

  - id: html-css-javascript
    name:
      en: "HTML/CSS/JavaScript"
      da: "HTML/CSS/JavaScript"
    # OWNER-PDF p.11-12 (Freelance Web- & IT-Løsninger) names no languages, so the freelance-web
    # card is not cited here; its HTML/CSS/JavaScript comes from the 24Support entry below.
    usedIn:
      # Old projectsData tags (NassimElH01): "HTML", "CSS", "JavaScript".
      - context: freelance
        project: 24support-christmas-calendar
      # Source: owner 2026-10-11, second round (JavaScript was taught in his bachelor programme)
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "Taught in the programme"
          da: "Undervist på uddannelsen"
      # Source: owner 2026-10-11, second round ("p5.js"); p5.js sketches are JavaScript
      # (legacy/posture-checker/index.html loads p5.js)
      - context: personal
        project: posture-checker
        note:
          en: "p5.js sketch"
          da: "p5.js-skitse"
      # Old projectsData tags (NassimElH01): "HTML/CSS" only, no JavaScript.
      # Source: CV-2 (ERHVERVSERFARING, S&S Rengøringsservice | IT-support & Webdesigner:
      # "vedligeholdt virksomhedens hjemmeside")
      # CONFLICT: the old site called this "Freelance webarbejde"; CV-2 lists S&S as a job and
      # wins, so the context is work, as in the project file.
      - context: work
        timeline: ss-rengoringservice
        project: ss-rengoringsservice-website
        note:
          en: "HTML and CSS; maintenance of the company website"
          da: "HTML og CSS; vedligeholdelse af virksomhedens hjemmeside"

  - id: p5js
    name:
      en: "p5.js"
      da: "p5.js"
    usedIn:
      # Source: legacy/posture-checker/index.html loads p5.js; OWNER (his work, personal)
      - context: personal
        project: posture-checker
        note:
          en: "Browser sketch that uses the webcam to check posture"
          da: "Browserskitse, der bruger webkameraet til at tjekke kropsholdningen"
      # Source: git history (PongGame.tsx moved to p5.js on 2026-09-04); OWNER (his work, personal)
      - context: personal
        project: canvas-arcade
        note:
          en: "Pong"
          da: "Pong"

  - id: client-server-apps-and-guis
    name:
      en: "Client-server applications and graphical user interfaces"
      da: "Client-server-applikationer og grafiske brugergrænseflader"
    usedIn:
      # Source: the owner's answer (2026-10-06: he built the 24Support server and admin tool
      # himself) and OLD-SITE (projectsData.ts "24support-julekalender": "en separat Node.js-server
      # til datostyring og et loginbeskyttet adminværktøj").
      - context: freelance
        project: 24support-christmas-calendar
        note:
          en: "Node.js server that controls when each door opens, and a login-protected admin tool"
          da: "Node.js-server, der styrer, hvornår hver låge åbner, og et loginbeskyttet adminværktøj"

  # The brief's "[BEKRÆFT] C#/Java/andet sprog" item is removed: the owner meant JavaScript
  # (owner 2026-10-11, second round: "p5.js og også i min bachelor"; p5.js is JavaScript),
  # which html-css-javascript above covers.

  # The next two items are NOT in the original brief. They were added from the EXAM
  # and REPORT evidence below; the owner may remove them.
  - id: generative-ai-prompting
    name:
      en: "Generative AI & prompting"
      da: "Generativ AI & prompting"
    usedIn:
      # Source: EXAM (p.18: prompting in ChatGPT; p.19: DALL-E, Adobe Firefly, HeyGen, InVideo)
      - context: study
        project: genai-ml-elective
        note:
          en: "Prompting in ChatGPT, plus AI image and video tools (DALL-E, Adobe Firefly, HeyGen, InVideo)"
          da: "Prompting i ChatGPT samt AI-værktøjer til billeder og video (DALL-E, Adobe Firefly, HeyGen, InVideo)"
      # Source: REPORT (p.5: "procesoptimering – herunder brugen af AI-værktøjer som CoPilot og
      # ChatGPT"; p.6: "brugerdokumentation og onboardingmateriale (ofte ved brug af AI)").
      # p.6 does not name the AI tools, so the note does not tie Copilot/ChatGPT to the documentation.
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "AI tools such as Copilot and ChatGPT for process optimisation, including user documentation and onboarding material often made with AI"
          da: "AI-værktøjer som Copilot og ChatGPT til procesoptimering, herunder brugerdokumentation og onboardingmateriale, ofte lavet med AI"
      # Source: the owner's answer (2026-10-06: "programering igennem claude og co pilot"), given to
      # the question whether he built the 24Support server and admin tool.
      - context: freelance
        project: 24support-christmas-calendar
        note:
          en: "Programmed the server and admin tool with Claude and Copilot"
          da: "Programmerede serveren og adminværktøjet med Claude og Copilot"

  - id: machine-learning-basics
    name:
      en: "Machine learning basics (Python notebooks)"
      da: "Grundlæggende machine learning (Python-notebooks)"
    usedIn:
      # Source: EXAM (p.21: notebook titles "Linear_Regression" and
      # "Fashion_classification_neural_nets"; no data or results are given)
      - context: study
        project: genai-ml-elective
        note:
          en: "Notebook assignments on linear regression and neural-network classification"
          da: "Notebook-opgaver i lineær regression og klassifikation med neurale netværk"

  # Not in the original brief either: added because the group had no data-analysis item,
  # the owner's CVs list "Dataanalyse" (new CV, Kompetencer; CV-2, Zealand "Fokus"), and the
  # IBM Data Analytics certificate had no skill. The owner may remove it.
  - id: data-analysis-visualization
    # Source: OWNER-PDF p.4 (Kernekompetencer, Data Wrangling & Eksplorativ Analyse: Pandas,
    # NumPy, Matplotlib, Seaborn) and p.9-10 (Airbnb, where they were used)
    name:
      en: "Data analysis and visualization (pandas, NumPy, Matplotlib, Seaborn)"
      da: "Dataanalyse og visualisering (pandas, NumPy, Matplotlib, Seaborn)"
    # Source: LinkedIn and the new CV (Certificeringer: "IBM Data Analytics", a data analytics
    # programme); owner 2026-10-11 (the Airbnb analysis is the "IBM Data Analyst" capstone).
    # CONFLICT (name): OWNER-PDF p.16 calls it "IBM Data Analyst Professional Certificate";
    # airbnb-eda.md asks the owner to confirm it is the same certificate.
    certifications:
      - ibm-data-analytics
    usedIn:
      # Source: OWNER-PDF p.9-10 (3. Udvalgte Projekter, Airbnb: bookings in New York City;
      # cleaning; "kortlægge prisforskelle på tværs af værelsestyper, evaluere afbestillingsreglers
      # indflydelse på lejepriser via boxplots"); owner 2026-10-11 (IBM capstone)
      - context: study
        project: airbnb-eda
        note:
          en: "IBM capstone: cleaned Airbnb booking data from New York City and compared prices across room types and cancellation policies"
          da: "IBM-capstone: rensede Airbnb-bookingdata fra New York City og sammenlignede priser på tværs af værelsestyper og afbestillingsregler"
