# Skill group "IT-governance & sikkerhed" from the owner's brief (CLAUDE.md).
# Evidence: brief (PMO-praktik at Royal Unibrew with IT/OT and cybersecurity
# projects; IBM Cybersecurity certification), the owner's CVs (CV-2, CV-CBS), the
# Royal Unibrew internship report (REPORT), the owner's LinkedIn certificates
# (PwC Security Awareness, PwC HackSchool; shared 2026-10-05) and the elective exam
# synopsis "Data og teknologi integration – Enhanced security" (EXAM-DTI).
#
# Conflict on the bachelor project, settled by the bachelor PDF (BACHELOR, shared by
# the owner on 2026-10-06): the old site (cvData) described it as OT cybersecurity and
# "cyber risk and governance in OT environments", and the owner's newest CV named it
# "OT Cyber Security & datadrevet projektstyring". The cover title, the abstract (p.1)
# and the research question (p.8) are about a hybrid PMO with ProjectFlow 365, Power BI
# and Azure DevOps. So the bachelor project is not cited for cybersecurity, and its
# IT-governance note uses CV-2's wording, which BACHELOR supports.
#
# OWNER-PDF is the owner's 18-page text pack ("Her er en komplet ... tekstpakke", shared
# 2026-10-11; written with an AI assistant, so used for facts only; PDF page numbers).
# The IBM cybersecurity capstone is cited from it and from the owner's answers on
# 2026-10-11 (IBM's evaluation: five tasks). Earlier sources win where they conflict.
group:
  en: "IT governance & security"
  da: "IT-governance & sikkerhed"
# Presentation only: 3rd (the owner may change the order; see project-and-business.yaml).
order: 3
items:
  - id: it-governance
    name:
      en: "IT governance"
      da: "IT-governance"
    usedIn:
      # Source: CV-2 (Royal Unibrew: "governance og fremdrift i Azure DevOps",
      # "governance-dokumentation"); CV-CBS (Royal Unibrew: "governance, dokumentation og
      # opfølgning i Azure DevOps og SharePoint")
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "Governance in Azure DevOps and governance documentation"
          da: "Governance i Azure DevOps og governance-dokumentation"
      # Source: CV-2 (Uddannelse, Zealand "Fokus: ... IT-governance")
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "Focus area in the programme"
          da: "Fokusområde på uddannelsen"
        scope:
          en: "Focus area in the programme"
          da: "Fokusområde på uddannelsen"
      # Source: CV-2 (Uddannelse, bachelorprojekt: "analyse af systemintegration,
      # dataejerskab og rolleafklaring") and BACHELOR p.14-15 (dataejerskab), p.29 (4.6),
      # p.36 (6.4.3 Data Stewardship) and p.37 (6.5 Systemintegration, 6.6 Rolleafklaring).
      # Conflicts with OLD-SITE, see the top comment.
      # Second sentence. Source: BACHELOR p.35 (6.3 Hybrid governance-model: "Den foreslåede
      # governance-model består af tre integrerede niveauer: beslutningsniveau,
      # eksekveringsniveau og læringsniveau"). A proposal, tested as a prototype only (p.40),
      # so the note says proposed.
      - context: study
        project: royal-unibrew-hybrid-pmo-bachelor-project
        note:
          en: "Analysis of system integration, data ownership and role clarification. Proposed a hybrid governance model on three levels: decision, execution and learning"
          da: "Analyse af systemintegration, dataejerskab og rolleafklaring. Foreslog en hybrid governance-model på tre niveauer: beslutning, eksekvering og læring"

  - id: networks-and-computer-architecture
    name:
      en: "Networks and computer architecture"
      da: "Netværk og computerarkitektur"
    usedIn:
      # Source: owner 2026-10-11 (IBM's evaluation, task 1: traffic analysis in Wireshark with
      # filters on an IP address, filter buttons and colouring a conversation; task 2: VoIP
      # analysis, SIP endpoints and call flow); OWNER-PDF p.10 (IBM Cybersecurity Project)
      - context: study
        project: ibm-cybersecurity-lab
        note:
          en: "Traffic analysis in Wireshark: IP filters, colour-coding a conversation and the SIP call flow of VoIP calls"
          da: "Trafikanalyse i Wireshark: IP-filtre, farvekodning af en samtale og SIP-opkaldsforløbet i VoIP-opkald"
      # Source: CV-2 and CV-CBS (Zealand: troubleshooting hardware); OWNER-PDF p.12 (4. Erhvervserfaring,
      # Zealand: "Fejlsøgte og konfigurerede hardware, netværk ..."), as in the timeline entry
      - context: work
        timeline: zealand-it-student-assistant
        note:
          en: "Troubleshooting hardware and networks in IT support"
          da: "Fejlfinding på hardware og netværk i IT-supporten"

  - id: cybersecurity
    name:
      en: "Cybersecurity"
      da: "Cybersikkerhed"
    # Source: LinkedIn certificates (2026-10-05): PwC Security Awareness diploma; PwC Hackschool 2024
    # certificate (teaching in cybersecurity, data protection law and technical implementation of security)
    certifications:
      - ibm-cybersecurity
      - pwc-security-awareness
      - pwc-hackschool
    usedIn:
      # Source: REPORT (p.6: OT Cyber Security project with "udvikling af use cases,
      # udarbejdelse af stakeholderanalyser, opfølgning på compliance-krav"); CV-2 (Royal Unibrew:
      # "IT- og OT-projekter (bl.a. Cyber Security)")
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "OT Cyber Security project: use cases, stakeholder analyses and compliance follow-up"
          da: "OT Cyber Security-projektet: use cases, stakeholderanalyser og opfølgning på compliance-krav"
      # Source: EXAM-DTI (elective synopsis "Data og teknologi integration – Enhanced security", p.3-5)
      - context: study
        project: enhanced-security-synopsis
        note:
          en: "Elective exam paper on encryption, access control (RBAC, MFA) and GDPR in data integration"
          da: "Valgfagssynopsis om kryptering, adgangskontrol (RBAC, MFA) og GDPR i dataintegration"
      # Source: owner 2026-10-11 (IBM's evaluation of the IBM Cybersecurity Analyst capstone, five
      # tasks: Wireshark, VoIP, password cracking with Hashcat and John the Ripper, manual SQL
      # injection on a test banking website, pen-tests with ZAP); OWNER-PDF p.10-11 (IBM
      # Cybersecurity Project)
      - context: study
        project: ibm-cybersecurity-lab
        note:
          en: "IBM capstone: traffic analysis in Wireshark, password cracking with Hashcat and John the Ripper, SQL injection and ZAP scans on test websites"
          da: "IBM-capstone: trafikanalyse i Wireshark, password-cracking med Hashcat og John the Ripper, SQL-injection og ZAP-scanninger af testsider"
