# Skill group "Projekt & forretning" from the owner's brief (CLAUDE.md).
# Certifications are from the brief and CV-2. Usage comes from the Royal Unibrew
# internship report (REPORT), the Gen AI & ML elective exam (EXAM) and CV-2.
# Agile methods are NOT cited for Royal Unibrew: REPORT p.8 says it works mainly
# with the waterfall model, and p.19 says agile/Scrum was not applied there.
# OWNER-PDF is the owner's 18-page text pack ("Her er en komplet ... tekstpakke", shared
# 2026-10-11; written with an AI assistant, so used for facts only; PDF page numbers).
# Earlier sources win where they conflict. Tjekkit is a group project (owner 2026-10-11); his
# own part was the wireframes and the prototype (second round), so entries that describe the
# group's work say "group project".
group:
  en: "Projects & business"
  da: "Projekt & forretning"
# Presentation only: first, for the roles his newest CV's headline names ("PMO |
# Projektkoordinering | Business Analysis | Dataanalyse"). The owner may change it.
order: 1
items:
  - id: prince2
    name:
      en: "PRINCE2"
      da: "PRINCE2"
    certifications:
      - prince2-foundation
      - prince2-practitioner
    usedIn:
      # Source: REPORT (p.8: "anvendte jeg PRINCE2's faseopdeling og risikostyringsprincipper"
      # in the project plan for the OT Cyber Security project)
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "Applied PRINCE2 phase division and risk management to the OT Cyber Security project plan"
          da: "Anvendte PRINCE2's faseopdeling og risikostyring i projektplanen for OT Cyber Security-projektet"
      # Source: OWNER-PDF p.8 (Hybrid PMO: PRINCE2 Agile among the theoretical frameworks) and
      # p.5 (PRINCE2 & Hybrid Governance: classic governance at decision level, agile iterations at
      # execution level); BACHELOR p.34 (6.1: the solution design builds on "PRINCE2's governance-
      # og beslutningslogik") and p.35 (6.3.1: "Beslutningsgates videreføres fra PRINCE2")
      - context: study
        project: royal-unibrew-hybrid-pmo-bachelor-project
        note:
          en: "Hybrid PMO design that keeps PRINCE2's decision gates"
          da: "Design af et hybridt PMO, der viderefører PRINCE2's beslutningsgates"

  - id: agile-methods
    name:
      en: "Agile methods"
      da: "Agile metoder"
    certifications:
      - agile-project-management
    # Source: CLAUDE.md <facts> (Kompetencer, owner 2026-10-12), verbatim (Danish). No "sprint cadence": the owner resolved on 2026-10-12
    # that REPORT p.19 (Royal Unibrew worked mainly by the waterfall model) wins over OWNER-PDF
    # p.12 ("sprint-kadencer"); the certificate's own name is "Certificering i Agil Projektledelse".
    gloss:
      en: "Scrum and Kanban (Certification in Agile Project Management, 2024); a backlog with epics and features in Azure DevOps at Royal Unibrew"
      da: "Scrum og Kanban (Certificering i Agil Projektledelse, 2024); backlog med epics og features i Azure DevOps hos Royal Unibrew"
    usedIn:
      # Source: CLAUDE.md <facts> (Kompetencer, owner 2026-10-12) ("backlog med epics og features i Azure DevOps hos Royal Unibrew") and
      # REPORT p.9 (epics and features for the OT Cyber Security project in Azure DevOps)
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "Backlog with epics and features in Azure DevOps"
          da: "Backlog med epics og features i Azure DevOps"
      # Source: REPORT (p.8: "På Zealand har jeg arbejdet meget med agile metoder og Scrum")
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "Agile methods and Scrum"
          da: "Agile metoder og Scrum"
      # Source: CV-2 (Uddannelse, bachelorprojekt: "Fra Vandfald til Hybrid PMO")
      - context: study
        project: royal-unibrew-hybrid-pmo-bachelor-project
        note:
          en: "From waterfall to a hybrid PMO"
          da: "Fra vandfald til hybrid PMO"

  # The brief's item "Interessent-, risiko- og kommunikationsplaner" is split in two, so the
  # page never shows communication plans next to evidence that is only about stakeholders and
  # risk (the section promises "every skill, traced to where it was used"). The name says what
  # the source says (analyses, risk management). The owner may merge them back.
  - id: stakeholder-analysis-risk-management
    name:
      en: "Stakeholder analysis and risk management"
      da: "Interessentanalyse og risikostyring"
    usedIn:
      # Source: REPORT (p.6: "udarbejdelse af stakeholderanalyser" for OT Cyber Security;
      # p.8: PRINCE2 "risikostyringsprincipper" in the OT project plan)
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "Stakeholder analyses and PRINCE2 risk management for the OT Cyber Security project"
          da: "Stakeholderanalyser og PRINCE2-risikostyring til OT Cyber Security-projektet"

  - id: communication-plans
    name:
      en: "Communication plans"
      da: "Kommunikationsplaner"
    # Source: CLAUDE.md <facts> (Kompetencer, owner 2026-10-12): "PBA 1. og 4. sem., Royal Unibrew PMO"; the text verbatim (Danish).
    gloss:
      en: "Communication and stakeholder plans for digital change"
      da: "Kommunikations- og interessentplaner ved digitale forandringer"
    usedIn:
      - context: internship
        timeline: royal-unibrew-pmo
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "1st and 4th semesters"
          da: "1. og 4. semester"
        scope:
          en: "1st and 4th semesters"
          da: "1. og 4. semester"

  - id: business-strategy-and-models
    name:
      en: "Business strategy and business models"
      da: "Forretningsstrategi og forretningsmodeller"
    usedIn:
      # Source: EXAM (p.18: "situationsanalyse (BMC, regnskabsanalyse, Porter's Five Forces og
      # PESTEL), en SWOT-oversigt", solved with ChatGPT prompts)
      - context: study
        project: genai-ml-elective
        # While the project is hidden (CLAUDE.md <pending> 6), the place is the programme.
        timeline: zealand-professionsbachelor
        note:
          en: "AI-assisted business analysis with BMC, Porter's Five Forces, PESTEL and SWOT"
          da: "AI-assisteret forretningsanalyse med BMC, Porters Five Forces, PESTEL og SWOT"

  - id: financial-management-and-financial-statement-analysis
    name:
      en: "Financial management and financial statement analysis"
      da: "Økonomistyring og regnskabsanalyse"
    usedIn:
      # Source: EXAM (p.18: "regnskabsanalyse" in the situation analysis)
      - context: study
        project: genai-ml-elective
        # While the project is hidden (CLAUDE.md <pending> 6), the place is the programme.
        timeline: zealand-professionsbachelor
        note:
          en: "Financial statement analysis as part of an AI-assisted business analysis"
          da: "Regnskabsanalyse som en del af en AI-assisteret forretningsanalyse"
      # Source: public/budget-skabelon.xlsx (budget, actual and difference per category);
      # OWNER (his work, personal)
      - context: personal
        project: budget-model
        note:
          en: "Monthly budget tracking: budget, actual and difference per category"
          da: "Månedlig budgetopfølgning: budget, faktisk og difference pr. kategori"
      # Source: OWNER-PDF p.8 (3. Udvalgte Projekter, Tjekkit: "cost-benefit analyse over en
      # 5-årig horisont med en fastlagt diskonteringsrente på 6 %"); owner 2026-10-11 (group project)
      - context: study
        project: tjekkit
        note:
          en: "Group project: cost-benefit analysis over five years with a 6% discount rate"
          da: "Gruppeprojekt: cost-benefit-analyse over fem år med en diskonteringsrente på 6 %"
        scope:
          en: "Group project"
          da: "Gruppeprojekt"

  - id: supply-chain
    name:
      en: "Supply chain"
      da: "Supply chain"
    usedIn:
      # Source: CLAUDE.md <facts> (Kompetencer, owner 2026-10-12): "PBA 2. sem. (SCM), Boozt"; the text verbatim (Danish). The Boozt case
      # gets its own project once its PDF is in _kilder/ (facts: every number is checked there).
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "Service level, inventory optimization and an automated warehouse (AutoStore), analysed in the Boozt case"
          da: "Servicegrad, lageroptimering og automatiseret lager (AutoStore) analyseret i Boozt-casen"

  - id: change-management
    name:
      en: "Change management"
      da: "Forandringsledelse"
    # The bachelor project is not cited: BACHELOR names Lewin, Kotter and ADKAR only in its
    # literature list and applies no change model. OWNER-PDF p.6 lists Kotter and Leavitt-Ry
    # as knowledge ("Kendskab til"), which is not usage.
    usedIn:
      # Source: REPORT (p.10: "modstand eller usikkerhed blandt kolleger i forbindelse med
      # implementeringen af nye Power BI-rapporter"; "brugte tid på at lave brugerdokumentation og
      # undervise kollegerne"; p.21: Kotter as inspiration for organisational resistance)
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "Met colleagues' resistance or uncertainty about new Power BI reports with user documentation and training"
          da: "Mødte kollegers modstand eller usikkerhed over for nye Power BI-rapporter med brugerdokumentation og undervisning"
      # Source: OWNER-PDF p.8 (3. Udvalgte Projekter, Tjekkit: "Implementeringsplan forankret i
      # Lewins forandringsteori for at sikre ejerskab blandt medarbejderne før og under udrulning");
      # owner 2026-10-11 (group project)
      - context: study
        project: tjekkit
        note:
          en: "Group project: implementation plan based on Lewin's change theory, to build staff ownership before and during the roll-out"
          da: "Gruppeprojekt: implementeringsplan baseret på Lewins forandringsteori, der skal skabe ejerskab blandt medarbejderne før og under udrulningen"
        scope:
          en: "Group project"
          da: "Gruppeprojekt"
