          da: "Igangværende kursus"

  - id: hci
    name:
      en: "Human-computer interaction (HCI)"
      da: "Menneske-computer-interaktion (HCI)"
    # Source: CLAUDE.md <facts> (Kompetencer, owner 2026-10-12): "RUC Designmetoder og Teknologier"; the text verbatim (Danish). The p5.js
    # face tracking course project (facts, Cases) is from workshop 2 of the same course.
