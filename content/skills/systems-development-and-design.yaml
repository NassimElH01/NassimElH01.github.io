# Skill group "Systemudvikling & design" from the owner's brief (CLAUDE.md).
# CV-2 lists "systemudvikling og IT-arkitektur" as a focus area of the Zealand PBA;
# that is cited for UML and system modeling only. OWNER-PDF (the owner's 18-page text
# pack, shared 2026-10-11; written with an AI assistant, so used for facts only; PDF
# page numbers) adds the Tjekkit group project for UML and prototyping (owner 2026-10-11:
# group project; his own part was the wireframes and the prototype, second round).
# 2026-10-12: the owner confirmed the RUC course "Designmetoder og Teknologier" (20 ECTS, autumn
# 2026) and agreed that it may stand as evidence for user-driven design, marked as in progress.
# 2026-10-12, CLAUDE.md <facts> (Kompetencer): requirements specification, UX and usability
# testing and HCI, with their contexts and texts. Physical computing stays hidden (pending 4).
group:
  en: "Systems development & design"
  da: "Systemudvikling & design"
# Presentation only: 5th (the owner may change the order; see project-and-business.yaml).
order: 5
items:
  - id: uml-system-modeling
    name:
      en: "UML and system modeling"
      da: "UML og systemmodellering"
    usedIn:
      # Source: CV-2 (Uddannelse, Zealand "Fokus: ... systemudvikling og IT-arkitektur").
      # CV-2 does not name UML itself.
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "Focus area in the programme: systems development and IT architecture"
          da: "Fokusområde på uddannelsen: systemudvikling og IT-arkitektur"
        # The whole note: CV-2 names systems development, not UML.
        scope:
          en: "Focus area in the programme: systems development and IT architecture"
          da: "Fokusområde på uddannelsen: systemudvikling og IT-arkitektur"
      # Source: OWNER-PDF p.7 (3. Udvalgte Projekter, Tjekkit, Systemdesign & Arkitektur:
      # "Use Case-diagrammer, domænemodeller, sekvensdiagrammer (SSD) og klassediagrammer");
      # owner 2026-10-11 (group project)
      - context: study
        project: tjekkit
        note:
          en: "Group project: use case diagrams, domain model, system sequence diagrams and class diagrams"
          da: "Gruppeprojekt: use case-diagrammer, domænemodel, systemsekvensdiagrammer og klassediagrammer"
        scope:
          en: "Group project"
          da: "Gruppeprojekt"

  - id: requirements-specification
    name:
      en: "Requirements specification"
      da: "Kravspecifikation"
    # Source: CLAUDE.md <facts> (Kompetencer, owner 2026-10-12): "Tjekkit, Boozt, OT-projektet"; the text verbatim (Danish). Not "SRS"
    # (facts: no source documents it yet). Each place names only itself; the gloss says what
    # the skill covers across them.
    gloss:
      en: "Requirements lists, use cases and user stories"
      da: "Kravlister, use cases og user stories"
    usedIn:
      # Also REPORT p.6 and p.13 (use cases for the OT Cyber Security project)
      - context: internship
        timeline: royal-unibrew-pmo
        note:
          en: "OT Cyber Security project"
          da: "OT Cyber Security-projektet"
        scope:
          en: "OT Cyber Security project"
          da: "OT Cyber Security-projektet"
      - context: study
        project: tjekkit
        note:
          en: "Group project"
          da: "Gruppeprojekt"
        scope:
          en: "Group project"
          da: "Gruppeprojekt"
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "Boozt case"
          da: "Boozt-casen"
        scope:
          en: "Boozt case"
          da: "Boozt-casen"

  - id: ux-usability-testing
    name:
      en: "UX and usability testing"
      da: "UX og usability-test"
    # Source: CLAUDE.md <facts> (Kompetencer, owner 2026-10-12): "Systemudvikling, RUC DMT"; the text verbatim (Danish). Not "A/B-test"
    # (facts: no source documents it yet). Each place names only itself; the gloss says what the
    # skill covers across them.
    gloss:
      en: "Wireframes and mockups; usability evaluation with Wizard of Oz"
      da: "Wireframes og mockups, usability-evaluering med Wizard of Oz"
    usedIn:
      - context: study
        timeline: zealand-professionsbachelor
        note:
          en: "Systems development"
          da: "Systemudvikling"
        scope:
          en: "Systems development"
          da: "Systemudvikling"
      - context: study
        timeline: ruc-master-digital-transformation
        note:
          en: "Course in progress: “Designmetoder og Teknologier”"
          da: "Igangværende kursus: “Designmetoder og Teknologier”"
        scope:
          en: "Course in progress"
          da: "Igangværende kursus"

  - id: prototyping
    name:
      en: "Prototyping (low → high fidelity)"
      da: "Prototyping (low → high fidelity)"
    usedIn:
      # Source: owner 2026-10-11, second round ("jeg tog mig af wireframes og prototypen")
      - context: study
        project: tjekkit
        note:
          en: "Group project: I made the wireframes and the prototype"
          da: "Gruppeprojekt: Jeg lavede wireframes og prototypen"
        scope:
          en: "Group project"
          da: "Gruppeprojekt"

  - id: user-driven-design
    name:
      en: "User-driven design"
      da: "Brugerdrevet design"
    usedIn:
