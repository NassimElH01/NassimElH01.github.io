# 2026-10-12: the owner confirmed the RUC course "Designmetoder og Teknologier" (20 ECTS, autumn
# 2026) and agreed that it may stand as evidence for user-driven design, marked as in progress.
# No source says where the other items were used, so their usedIn stays a TODO for the owner.
