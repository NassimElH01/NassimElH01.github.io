      da: "Interaktive prototyper med fokus på kropslig interaktion og feedback"
    usedIn:
      - context: study
        timeline: ruc-master-digital-transformation
        note:
          en: "Course in progress: “Designmetoder og Teknologier”"
          da: "Igangværende kursus: “Designmetoder og Teknologier”"
        scope:
          en: "Course in progress"
          da: "Igangværende kursus"
      - context: study
        project: p5js-face-tracking
        note:
          en: "Course project"
          da: "Kursusprojekt"
        scope:
          en: "Course project"
          da: "Kursusprojekt"

